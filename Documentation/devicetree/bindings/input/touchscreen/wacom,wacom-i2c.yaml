%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/wacom,wacom-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wacom EMR pen digitizer connected via I2C

maintainers:
  - Tatsunosuke Tobita <tobita.tatsunosuke@wacom.co.jp>

description: |
  Wacom EMR (electro-magnetic resonance) pen digitizers that speak the
  register/feature-report protocol handled by drivers/input/touchscreen/
  wacom_i2c.c: commands are written to register 0x0004 and coordinate
  frames are read as 19 plain bytes on the data register.

  Not all firmwares answer the feature query even though they stream
  coordinates; where the query fails, the axis limits come from the
  common touchscreen properties instead.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: wacom,wacom-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Core digital supply of the digitizer.

  reset-gpios:
    maxItems: 1

  wacom,no-barrel-switch2:
    type: boolean
    description:
      The second barrel switch (data[3] bit 4) is not usable on this
      board: the firmware holds the bit set for every in-proximity
      frame.  When present the driver neither reports BTN_STYLUS2 nor
      advertises the capability.

  wacom,visible-x-min:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: See wacom,visible-y-max.

  wacom,visible-x-max:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: See wacom,visible-y-max.

  wacom,visible-y-min:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: See wacom,visible-y-max.

  wacom,visible-y-max:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Visible-area window in hardware frame coordinates (before any
      touchscreen-inverted-* mapping is applied).  Some panels keep
      reporting a millimetre or two past the visible glass on every
      side; when all four values are given the driver remaps the window
      onto the full reported axis range so userspace receives exactly
      the visible area.  Coordinates outside the window clamp to the
      edges.  All four properties are required for the remap to apply;
      otherwise it is ignored.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        digitizer@9 {
            compatible = "wacom,wacom-i2c";
            reg = <0x09>;
            interrupt-parent = <&pio>;
            interrupts = <9 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&pio 88 GPIO_ACTIVE_LOW>;
            vdd-supply = <&reg_1v8>;
            touchscreen-size-x = <16320>;
            touchscreen-size-y = <21120>;
        };
    };

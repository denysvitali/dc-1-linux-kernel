%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/wacom,wacom-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wacom EMR pen digitizer connected via I2C

maintainers:
  - Tatsunosuke Tobita <tobita.tatsunosuke@wacom.co.jp>

description: |
  Wacom EMR (electro-magnetic resonance) pen digitizers that speak the
  register/feature-report protocol handled by drivers/input/touchscreen/
  wacom_i2c.c: commands are written to register 0x0004 and coordinate
  frames are read as 19 plain bytes on the data register.

  Not all firmwares answer the feature query even though they stream
  coordinates; where the query fails, the axis limits come from the
  common touchscreen properties instead.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: wacom,wacom-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Core digital supply of the digitizer.

  reset-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        digitizer@9 {
            compatible = "wacom,wacom-i2c";
            reg = <0x09>;
            interrupt-parent = <&pio>;
            interrupts = <9 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&pio 88 GPIO_ACTIVE_LOW>;
            vdd-supply = <&reg_1v8>;
            touchscreen-size-x = <16320>;
            touchscreen-size-y = <21120>;
        };
    };
